<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" font-family="ui-monospace, Menlo, monospace">
  <rect width="640" height="400" fill="#0C131C"/>
  <g stroke="#6BA6FF" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 34H640M0 68H640M0 102H640M0 136H640M0 170H640M0 204H640M0 238H640M0 272H640M0 306H640M0 340H640M0 374H640M34 0V400M68 0V400M102 0V400M136 0V400M170 0V400M204 0V400M238 0V400M272 0V400M306 0V400M340 0V400M374 0V400M408 0V400M442 0V400M476 0V400M510 0V400M544 0V400M578 0V400M612 0V400"/>
  </g>

  <!-- facade -->
  <g fill="none" stroke="#6BA6FF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="110" y="150" width="420" height="200"/>
    <line x1="110" y1="232" x2="530" y2="232" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="110" y1="300" x2="530" y2="300" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="150" y="180" width="40" height="44"/>
    <rect x="150" y="252" width="40" height="44"/>
    <rect x="430" y="180" width="40" height="44"/>
    <rect x="430" y="252" width="40" height="44"/>
    <rect x="292" y="308" width="46" height="42"/>
  </g>

  <!-- roof gable outline: left rampant bowed (sag), right rampant crisp -->
  <g fill="none" stroke="#6BA6FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 150 Q196 112 320 62"/>
    <line x1="320" y1="60" x2="550" y2="150"/>
    <line x1="90" y1="150" x2="550" y2="150"/>
  </g>

  <!-- LEFT: état constaté -->
  <g clip-path="inset(0 320px 0 0)">
    <g stroke="#6BA6FF" stroke-width="1" stroke-opacity="0.55">
      <line x1="97.7" y1="147" x2="320" y2="147"/>
      <line x1="125.8" y1="136" x2="320" y2="136"/>
      <line x1="182.0" y1="114" x2="320" y2="114"/>
      <line x1="238.2" y1="92" x2="320" y2="92"/>
      <line x1="266.3" y1="81" x2="320" y2="81"/>
    </g>
    <g stroke="#6BA6FF" stroke-width="1.4" stroke-opacity="0.9">
      <path d="M150 122 l10 10 M160 122 l-10 10"/>
      <path d="M205 100 l10 10 M215 100 l-10 10"/>
    </g>
    <rect x="120" y="138" width="52" height="11" fill="url(#b)" stroke="#6BA6FF" stroke-opacity="0.5"/>
    <g fill="#6BA6FF" fill-opacity="0.4">
      <circle cx="100" cy="147" r="1.6"/><circle cx="108" cy="149" r="1.6"/><circle cx="116" cy="146" r="1.6"/><circle cx="124" cy="149" r="1.6"/><circle cx="132" cy="147" r="1.6"/>
    </g>
    <path d="M92 150 q46 16 96 10" fill="none" stroke="#6BA6FF" stroke-width="1.3"/>
    <g stroke="#6BA6FF" stroke-width="1" stroke-opacity="0.6">
      <line x1="120" y1="162" x2="118" y2="170"/><line x1="140" y1="164" x2="138" y2="172"/>
    </g>
  </g>

  <!-- RIGHT: après réfection -->
  <g clip-path="inset(0 0 0 320px)">
    <g stroke="#6BA6FF" stroke-width="1" stroke-opacity="0.7">
      <line x1="320" y1="147" x2="542.3" y2="147"/>
      <line x1="320" y1="136" x2="514.2" y2="136"/>
      <line x1="320" y1="125" x2="486.1" y2="125"/>
      <line x1="320" y1="114" x2="458.0" y2="114"/>
      <line x1="320" y1="103" x2="429.9" y2="103"/>
      <line x1="320" y1="92" x2="401.8" y2="92"/>
      <line x1="320" y1="81" x2="373.7" y2="81"/>
      <line x1="320" y1="70" x2="345.6" y2="70"/>
    </g>
    <path d="M410 96 l40 16 l-8 7 l-40 -16 z" fill="none" stroke="#6BA6FF" stroke-width="1.2"/>
    <line x1="360" y1="150" x2="548" y2="150" stroke="#6BA6FF" stroke-width="1.6"/>
    <line x1="540" y1="150" x2="540" y2="338" stroke="#6BA6FF" stroke-width="1.4"/>
  </g>

  <!-- chimney straddling ridge -->
  <g fill="none" stroke="#6BA6FF" stroke-width="1.3">
    <path d="M296 60 L296 34 L340 34 L340 60"/>
    <line x1="290" y1="30" x2="346" y2="30"/>
    <path d="M340 58 l6 -6 l6 6 l6 -6" stroke-opacity="0.85" stroke-width="1"/>
    <path d="M300 50 l-4 8 M308 40 l-4 8" stroke-opacity="0.5" stroke-width="1"/>
  </g>

  <!-- faîtière caps (après) -->
  <g fill="none" stroke="#6BA6FF" stroke-width="1.2">
    <path d="M344 66 q6 -7 12 0 M356 62 q6 -7 12 0"/>
  </g>

  <!-- split divider -->
  <line x1="320" y1="24" x2="320" y2="352" stroke="#6BA6FF" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.7"/>

  <!-- labels -->
  <g fill="#6BA6FF" font-size="11" letter-spacing="0.06em">
    <text x="312" y="20" text-anchor="end">◄ ÉTAT CONSTATÉ</text>
    <text x="328" y="20" text-anchor="start">APRÈS RÉFECTION ►</text>
    <g stroke="#6BA6FF" stroke-width="0.75" stroke-opacity="0.5">
      <line x1="60" y1="70" x2="150" y2="105"/>
      <line x1="60" y1="118" x2="196" y2="118"/>
      <line x1="60" y1="196" x2="140" y2="166"/>
      <line x1="60" y1="240" x2="120" y2="150"/>
      <line x1="470" y1="60" x2="360" y2="78"/>
      <line x1="470" y1="120" x2="430" y2="120"/>
      <line x1="470" y1="250" x2="540" y2="250"/>
    </g>
    <text x="56" y="70" text-anchor="end">ARDOISES GLISSÉES / CASSÉES</text>
    <text x="56" y="118" text-anchor="end">FAÎTAGE DESCELLÉ, RIVE AFFAISSÉE</text>
    <text x="56" y="196" text-anchor="end">GOUTTIÈRE DÉFORMÉE</text>
    <text x="56" y="240" text-anchor="end">MOUSSE ET LICHEN EN ÉGOUT</text>
    <text x="474" y="60" text-anchor="start">COUVERTURE NEUVE ARDOISE D’ANJOU</text>
    <text x="474" y="120" text-anchor="start">FAÎTIÈRE + CLOSOIR VENTILÉ</text>
    <text x="474" y="250" text-anchor="start">ZINGUERIE ET DESCENTE NEUVES</text>
  </g>

  <!-- cartouche -->
  <g>
    <rect x="16" y="362" width="608" height="26" fill="none" stroke="#6BA6FF" stroke-opacity="0.5"/>
    <text x="24" y="379" fill="#6BA6FF" font-size="10" letter-spacing="0.12em">RÉF. 2024-118 · MAISON DE VILLE EN TUFFEAU · SECTEUR SAUVEGARDÉ, ANGERS · RÉFECTION COMPLÈTE 92 M²</text>
  </g>

  <defs>
    <pattern id="b" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6BA6FF" stroke-opacity="0.4"/>
    </pattern>
  </defs>
</svg>
